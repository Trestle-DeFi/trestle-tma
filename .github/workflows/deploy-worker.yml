name: Deploy Vault Worker

on:
  push:
    branches: [main, master]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'worker/.nvmrc'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: worker
      - name: Ensure workerd runtime is installed
        run: |
          npm rebuild workerd --foreground-scripts
          node_modules/workerd/bin/workerd --version
        working-directory: worker
      - name: Bundle check
        run: npm run deploy:dry-run
        working-directory: worker
      - name: Run worker tests
        run: npm test
        working-directory: worker
        timeout-minutes: 5
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: 4.168.0
          command: deploy src/index.js --config wrangler.jsonc