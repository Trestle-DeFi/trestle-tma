name: Deploy Frontend (Cloudflare Pages)

on:
  push:
    branches: [main, master]
    paths: ['frontend/**', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          # Project name defaults to `trestle-tma`; set the repo variable
          # PAGES_PROJECT_NAME if the Pages project is named differently.
          # NOTE: disable the Pages project's git-integration auto builds in the
          # Cloudflare dashboard, otherwise every push deploys twice.
          command: pages deploy dist --project-name=${{ vars.PAGES_PROJECT_NAME || 'trestle-tma' }}